name: 投稿の反映

on:
  push:
    branches: [main]
    paths:
      - "inbox/*/submission.json"
  workflow_dispatch:

permissions:
  contents: write

# データを書き換える処理は1つずつ動かす
concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pillow（画像処理）を入れる
        run: pip install --quiet "Pillow>=10,<12"
      - name: 投稿を反映する
        run: python scripts/apply_inbox.py
      - name: コミット（失敗した投稿があっても、成功した分は反映する）
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data inbox
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "投稿を反映"
            git pull --rebase
            git push
          fi
